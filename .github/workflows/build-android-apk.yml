name: Build Downloadable Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Finsistant V2 Android APK
        working-directory: mobile-app
        run: gradle assembleDebug --no-daemon

      - name: Package APK binary
        run: |
          mkdir -p dist
          cp mobile-app/app/build/outputs/apk/debug/app-debug.apk dist/Finsistant-V2-mobile.apk
          ls -lh dist/Finsistant-V2-mobile.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finsistant-V2-mobile-apk
          path: dist/Finsistant-V2-mobile.apk
          retention-days: 90

      - name: Publish Direct-Download GitHub Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0-mobile"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Finsistant-V2-mobile.apk --clobber
          else
            gh release create "$TAG" dist/Finsistant-V2-mobile.apk \
              --title "Finsistant V2 Mobile App (Android APK)" \
              --notes "Download Finsistant-V2-mobile.apk directly to install the 5-tab native Android mobile client connected live to GitHub Cloud Yahoo Finance + Kite + Gemini CRO telemetry."
          fi
