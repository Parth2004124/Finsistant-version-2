name: CI Unit & Regression Tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pytest numpy pandas yfinance requests python-dotenv pyotp

      - name: Run M3.1 and M3.2 regression test suites
        run: |
          set +e
          python3 -m pytest -v --tb=short tests/m3_1 tests/m3_2 tests/test_release_audit.py > pytest_out.txt 2>&1
          RC=$?
          cat pytest_out.txt
          cat pytest_out.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path("pytest_out.txt").read_text(encoding="utf-8", errors="replace").splitlines()
          summary = lines[-60:]
          for ln in summary:
              if ln.strip():
                  print(f"::error::{ln[:400]}")
          PY
          fi
          exit "$RC"
