name: CI Unit & Regression Tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pytest numpy pandas yfinance requests python-dotenv pyotp

      - name: Run M3.1 and M3.2 regression test suites
        run: |
          python3 -m pytest -v tests/m3_1 tests/m3_2 tests/test_release_audit.py
