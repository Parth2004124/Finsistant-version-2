name: Live Orchestration Scan

on:
  schedule:
    # Run every 30 minutes Monday-Friday (covers NSE & US market hours)
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "finsistant_v2/**"
      - "scripts/generate_live_scan.py"
      - "server.py"

permissions:
  contents: write

jobs:
  live-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run live data & 3-agent orchestration scan
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: python3 scripts/generate_live_scan.py

      - name: Commit updated live_scan.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_scan.json
          if git diff --staged --quiet; then
            echo "No live_scan.json changes."
          else
            git commit -m "chore: update live orchestration scan snapshot"
            git push
          fi
