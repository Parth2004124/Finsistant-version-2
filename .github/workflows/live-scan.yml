name: Live Orchestration Scan

on:
  schedule:
    # Run every 15 minutes Monday-Friday (covers NSE & US market hours)
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      add_symbol:
        description: "Optional live ticker to add & scan (e.g. AAPL, WIPRO)"
        required: false
        default: ""
        type: string
      remove_symbol:
        description: "Optional extra ticker to remove from watchlist"
        required: false
        default: ""
        type: string
      refresh_kite:
        description: "Force fresh daily Zerodha Kite TOTP session"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "finsistant_v2/**"
      - "scripts/generate_live_scan.py"
      - "server.py"
      - "reports/moreshwar_3_2/orchestrator_scan/latest_scan.json"

concurrency:
  group: live-orchestration-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install live data dependencies (yfinance + requests)
        run: python3 -m pip install --quiet --upgrade yfinance requests

      - name: Run live data & 3-agent orchestration scan
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET: ${{ secrets.KITE_TOTP_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADD_SYMBOL: ${{ github.event.inputs.add_symbol || '' }}
          REMOVE_SYMBOL: ${{ github.event.inputs.remove_symbol || '' }}
          FORCE_KITE_REFRESH: ${{ github.event.inputs.refresh_kite || 'false' }}
        run: |
          set +e
          python3 scripts/generate_live_scan.py > live_scan_run.log 2>&1
          RC=$?
          cat live_scan_run.log
          if [ "$RC" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path("live_scan_run.log").read_text(encoding="utf-8", errors="replace").splitlines()
          for ln in lines[-10:]:
              if ln.strip():
                  print(f"::error::{ln[:400]}")
          PY
          fi
          rm -f live_scan_run.log
          exit "$RC"

      - name: Commit updated live_scan.json and audit ledger if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_scan.json watchlist_config.json data/decision_audit_ledger.json
          if git diff --staged --quiet; then
            echo "No live_scan.json or audit ledger changes."
          else
            git commit -m "chore: update live orchestration scan snapshot"
            git pull --rebase --autostash origin main
            git push
          fi
