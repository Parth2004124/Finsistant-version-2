name: Live Orchestration Scan

on:
  schedule:
    # Run every 15 minutes Monday-Friday (covers NSE & US market hours)
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      add_symbol:
        description: "Optional live ticker to add & scan (e.g. AAPL, WIPRO)"
        required: false
        default: ""
        type: string
      remove_symbol:
        description: "Optional extra ticker to remove from watchlist"
        required: false
        default: ""
        type: string
      refresh_kite:
        description: "Force fresh daily Zerodha Kite TOTP session"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "finsistant_v2/**"
      - "scripts/generate_live_scan.py"
      - "server.py"

concurrency:
  group: live-orchestration-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yfinance for live Yahoo Finance session
        run: python3 -m pip install --quiet --upgrade yfinance

      - name: Run live data & 3-agent orchestration scan
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET: ${{ secrets.KITE_TOTP_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          ADD_SYMBOL: ${{ github.event.inputs.add_symbol || '' }}
          REMOVE_SYMBOL: ${{ github.event.inputs.remove_symbol || '' }}
          FORCE_KITE_REFRESH: ${{ github.event.inputs.refresh_kite || 'false' }}
        run: python3 scripts/generate_live_scan.py

      - name: Commit updated live_scan.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_scan.json watchlist_config.json
          if git diff --staged --quiet; then
            echo "No live_scan.json changes."
          else
            git commit -m "chore: update live orchestration scan snapshot"
            git push
          fi
